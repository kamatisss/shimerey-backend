# Render Blueprint (DEPLOY.md → "Render"): the API only, on the free plan, in Singapore.
# No daily cron job: its work already happens during normal use (unpaid online orders expire when
# someone checks out or opens the orders list; old crew retry keys are cleared by the middleware), and
# its backup step is skipped on Postgres anyway. Free plan: the service sleeps after 15 minutes idle.
# Render → New → Blueprint → pick this repo. Values marked sync: false are asked for once, in the
# dashboard; they never go into git. The database is a Render Postgres made in the dashboard (Singapore),
# not part of this Blueprint: its Internal Database URL is DATABASE_URL. (A `databases:` section here
# would make the Blueprint create a second, empty database.)
services:
  - type: web
    name: garden-studio-api
    runtime: python
    region: singapore
    plan: free               # sleeps after 15 min idle; the first request after that waits for it to wake
    # build.sh: install, collectstatic, migrate (a failing migration stops the deploy)
    buildCommand: bash build.sh
    # 2 processes × 4 threads: slow Gemini / PayMongo calls don't block other requests, within 512 MB
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/business/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: REQUIRE_CLOUD_STORAGE   # refuse to start without R2: this disk is wiped on every deploy
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: NUM_PROXIES             # check after the first deploy (DEPLOY.md → "Check the login limit")
        value: "1"
      - key: DJANGO_SECRET_KEY       # copy the old server's: keeps everyone signed in
        sync: false
      - key: ALLOWED_HOSTS           # garden-studio-api.onrender.com (plus your own api. domain later)
        sync: false
      - key: FRONTEND_URL            # https://shimereyslandscaping.vercel.app
        sync: false
      - key: DATABASE_URL            # Render Postgres → Connect → Internal Database URL (same region)
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET # from the NEW webhook pointing at this service
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY        # copy the old server's: changing them signs every phone out of alerts
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID        # a token allowed to read & write BOTH buckets
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET               # 3D models bucket
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_MEDIA_BUCKET         # photos & documents bucket
        sync: false
      - key: R2_MEDIA_PUBLIC_URL
        sync: false
